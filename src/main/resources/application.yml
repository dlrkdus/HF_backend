spring:
  profiles:
    active:
      - no-auth
      - secret
      - constants
      - priv # 각각 개발 환경에 따라 개별 설정이 필요할 수 있으므로
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2KB
      max-file-size: 5MB
      max-request-size: 7MB

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    logging:
      level:
        org.hibernate.SQL: DEBUG
        org.hibernate.type.descriptor.sql.BasicBinder: TRACE

  datasource:
    url: jdbc:mysql://localhost:3306/hf
    driver-class-name: com.mysql.cj.jdbc.Driver
    # username과 password는 Local 개발 환경이므로 편의상 공개해 놓음
    # 배포 환경에서는 application-secret.yml 파일에 저장
    username: root
    password: 1111

  cloud:
    aws:
      sqs:
        listener:
          max-concurrent-messages: 5
          max-messages-per-poll: 3
          poll-timeout: 10s


logging:
  level:
    org:
      springframework:
        security: trace
      hibernate:
        SQL: debug
        orm:
          jdbc:
            bind: trace
        type:
          descriptor:
            sql:
              BasicBinder: trace
    com:
      hf:
        healthfriend: trace

redis:
  host: ${REDIS_HOST}

management:
  endpoint:
    beans:
      enabled: true
  endpoints:
    web:
      exposure:
        include: beans, health

local-file-upload: true

springdoc:
  packages-to-scan: com.hf.healthfriend
  override-with-generic-response: true
  default-consumes-media-type: application/json;charset=UTF-8
  default-produces-media-type: application/json;charset=UTF-8
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha

client:
  domain: localhost
  origin: http://localhost:3000

server:
  port: 8080

backend:
  origin: http://localhost:8080

file:
  upload-dir: C:/hf/upload/

aws:
  region: ap-northeast-2
  sns:
    topicArn: arn:aws:sns:ap-northeast-2:676206915972:hf-notification
  sqs:
    alarmQueueUrl: ${AWS_SQS_ALARM_QUEUE_URL}
    alarmDlqUrl: ${AWS_SQS_ALARM_DLQ_URL}

secret:
  oauth2:
    kakao:
      client-id: ${KAKAO_CLIENT_ID}
    google:
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET}